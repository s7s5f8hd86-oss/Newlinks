<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DropIt • by Sanjeet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }
        .card {
            background: #161b22;
            border-radius: 1.5rem;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 500px;
            padding: 1.8rem 1.4rem;
        }
        .header { text-align: center; margin-bottom: 1rem; }
        .header h1 { font-size: 2rem; color: #e6edf3; font-weight: 700; }
        .header .byline { font-size: 0.75rem; color: #8b949e; margin-top: 0.2rem; }
        .quote-box {
            background: #1c2129;
            border-left: 3px solid #58a6ff;
            border-radius: 0.8rem;
            padding: 1rem 1.1rem;
            margin-bottom: 1.2rem;
        }
        .quote-text { font-size: 0.9rem; color: #c9d1d9; font-style: italic; line-height: 1.5; }
        .quote-author { font-size: 0.75rem; color: #8b949e; margin-top: 0.4rem; text-align: right; }
        input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0.8rem;
            padding: 0.85rem 1rem;
            color: #e6edf3;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 0.6rem;
        }
        input:focus { border-color: #58a6ff; }
        .input-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
        .input-row input { flex: 1; margin-bottom: 0; }
        button {
            background: #238636;
            color: white;
            border: none;
            border-radius: 0.8rem;
            padding: 0.85rem 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }
        button:active { transform: scale(0.96); }
        button.red { background: #da3633; }
        button.blue { background: #1f6feb; }
        .links-title { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin: 1rem 0 0.5rem; }
        .link-item {
            background: #1c2129;
            border: 1px solid #30363d;
            border-radius: 0.7rem;
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
        }
        .link-url { color: #c9d1d9; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-decoration: none; }
        .visit-btn {
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .del-btn { background: none; border: none; color: #f85149; font-size: 1.1rem; cursor: pointer; padding: 0.2rem 0.4rem; font-weight: bold; }
        .empty { color: #484f58; text-align: center; font-size: 0.85rem; padding: 1.5rem; }
        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.7rem; color: #484f58; }
        .footer span { color: #58a6ff; }
        .status { text-align: center; font-size: 0.75rem; color: #3fb950; margin-top: 0.3rem; min-height: 1.2rem; }
        .status.error { color: #f85149; }
        .sync-badge {
            display: inline-block;
            background: #1c2129;
            color: #3fb950;
            font-size: 0.65rem;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            margin-left: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📦 DropIt</h1>
            <div class="byline">written by <strong>Sanjeet</strong></div>
        </div>

        <div class="quote-box">
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-author" id="quoteAuthor"></div>
        </div>

        <div class="input-row">
            <input type="url" id="linkInput" placeholder="Paste any link here..." autocomplete="off" />
            <button id="addBtn">+ Add</button>
        </div>

        <div class="status" id="statusMsg"></div>

        <div class="links-title">📋 saved links <span id="countSpan">(0)</span> <span class="sync-badge" id="syncBadge" style="display:none;">🟢 live</span></div>
        <div id="linksContainer"><div class="empty">Loading links...</div></div>

        <div class="input-row" style="margin-top: 0.8rem;">
            <button class="red" id="clearBtn">🗑 Clear All</button>
            <button class="blue" id="shareBtn">📤 Share Page</button>
        </div>

        <div class="footer">crafted by <span>Sanjeet</span> • opens on any device</div>
    </div>

    <script>
        // ============================================================
        // DAILY QUOTES
        // ============================================================
        const quotes = [
            { text: "The wound is the place where the Light enters you.", author: "Rumi" },
            { text: "He who has a why to live can bear almost any how.", author: "Nietzsche" },
            { text: "In the middle of difficulty lies opportunity.", author: "Einstein" },
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Solitude is the place of purification.", author: "Martin Buber" },
            { text: "What you seek is seeking you.", author: "Rumi" },
            { text: "Success is not final, failure is not fatal.", author: "Churchill" },
            { text: "The unexamined life is not worth living.", author: "Socrates" },
            { text: "We are what we repeatedly do.", author: "Aristotle" },
            { text: "Love transforms enemies into friends.", author: "MLK Jr." },
            { text: "It is not that we have short time, but we waste a lot.", author: "Seneca" },
            { text: "Hard times create strong men.", author: "G. Michael Hopf" },
            { text: "Become who you truly are.", author: "Carl Jung" },
            { text: "Be the change you wish to see.", author: "Gandhi" },
            { text: "Within me there lay an invincible summer.", author: "Camus" },
            { text: "Patience is bitter, but its fruit is sweet.", author: "Aristotle" },
            { text: "He who conquers himself is mighty.", author: "Confucius" },
            { text: "The cave you fear holds the treasure.", author: "Joseph Campbell" },
            { text: "To love and be loved is sun from both sides.", author: "David Viscott" },
            { text: "Leave a trail where there is no path.", author: "Emerson" },
            { text: "Rock bottom built my foundation.", author: "J.K. Rowling" },
            { text: "You've been planted, not buried.", author: "Christine Caine" },
            { text: "Rising every time we fall is glory.", author: "Mandela" },
            { text: "Solitude is the richness of self.", author: "May Sarton" },
            { text: "What lies within us matters most.", author: "Emerson" },
            { text: "What you think you become.", author: "Buddha" },
            { text: "Love removes masks we fear to lose.", author: "James Baldwin" },
            { text: "Happiness depends upon ourselves.", author: "Aristotle" },
            { text: "The only journey is the one within.", author: "Rilke" },
            { text: "Find barriers within you against love.", author: "Rumi" },
        ];

        const today = new Date();
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        const q = quotes[dayOfYear % quotes.length];
        document.getElementById("quoteText").textContent = '"' + q.text + '"';
        document.getElementById("quoteAuthor").textContent = '— ' + q.author;

        // ============================================================
        // USING GIST.GITHUB.COM AS FREE DATABASE (works everywhere!)
        // ============================================================
        // We'll use a simple approach: store the link list in the URL hash
        // When you share the URL, the links go with it!

        const linkInput = document.getElementById("linkInput");
        const addBtn = document.getElementById("addBtn");
        const linksContainer = document.getElementById("linksContainer");
        const countSpan = document.getElementById("countSpan");
        const clearBtn = document.getElementById("clearBtn");
        const shareBtn = document.getElementById("shareBtn");
        const statusMsg = document.getElementById("statusMsg");
        const syncBadge = document.getElementById("syncBadge");

        let linksData = [];

        // ============================================================
        // ENCODE/DECODE LINKS IN URL
        // ============================================================
        function loadLinksFromUrl() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                try {
                    const decoded = atob(decodeURIComponent(hash));
                    linksData = JSON.parse(decoded);
                    if (!Array.isArray(linksData)) linksData = [];
                } catch (e) {
                    linksData = [];
                }
            } else {
                linksData = [];
            }
        }

        function saveLinksToUrl() {
            if (linksData.length === 0) {
                // Clear hash
                window.history.replaceState(null, "", window.location.pathname);
                syncBadge.style.display = "none";
            } else {
                const encoded = encodeURIComponent(btoa(JSON.stringify(linksData)));
                window.history.replaceState(null, "", window.location.pathname + "#" + encoded);
                syncBadge.style.display = "inline";
            }
        }

        function getShareableUrl() {
            if (linksData.length === 0) return window.location.href;
            const encoded = encodeURIComponent(btoa(JSON.stringify(linksData)));
            return window.location.origin + window.location.pathname + "#" + encoded;
        }

        // ============================================================
        // SHOW STATUS
        // ============================================================
        function showStatus(msg, isError) {
            statusMsg.textContent = msg;
            statusMsg.className = "status";
            if (isError) statusMsg.className = "status error";
            setTimeout(function() {
                statusMsg.textContent = "";
            }, 3000);
        }

        // ============================================================
        // RENDER LINKS
        // ============================================================
        function renderLinks() {
            countSpan.textContent = "(" + linksData.length + ")";
            linksContainer.innerHTML = "";

            if (linksData.length === 0) {
                linksContainer.innerHTML = '<div class="empty">No links yet. Add one above.<br><small>Share this page URL to sync links</small></div>';
                return;
            }

            for (let i = linksData.length - 1; i >= 0; i--) {
                const url = linksData[i];
                const div = document.createElement("div");
                div.className = "link-item";

                const us = document.createElement("a");
                us.className = "link-url";
                us.textContent = url;
                us.title = url;
                us.href = url;
                us.target = "_blank";
                us.rel = "noopener";

                const vb = document.createElement("button");
                vb.className = "visit-btn";
                vb.textContent = "Visit →";
                vb.addEventListener("click", function(e) {
                    e.stopPropagation();
                    window.open(url, "_blank", "noopener");
                });

                const db = document.createElement("button");
                db.className = "del-btn";
                db.textContent = "✕";
                db.title = "Remove this link";
                (function(index) {
                    db.addEventListener("click", function(e) {
                        e.stopPropagation();
                        linksData.splice(index, 1);
                        saveLinksToUrl();
                        renderLinks();
                        showStatus("✅ Link removed! Share the updated URL.");
                    });
                })(i);

                div.appendChild(us);
                div.appendChild(vb);
                div.appendChild(db);
                linksContainer.appendChild(div);
            }

            saveLinksToUrl();
        }

        // ============================================================
        // ADD LINK
        // ============================================================
        function addLink() {
            let url = linkInput.value.trim();
            if (!url) {
                showStatus("Please paste a link first.", true);
                return;
            }
            if (!/^https?:\/\//i.test(url)) {
                url = "https://" + url;
            }
            try {
                new URL(url);
            } catch (e) {
                showStatus("Please enter a valid link.", true);
                return;
            }

            linksData.push(url);
            linkInput.value = "";
            renderLinks();
            showStatus("✅ Link added! Share this page URL to sync.");
        }

        // ============================================================
        // CLEAR ALL
        // ============================================================
        function clearAll() {
            if (linksData.length === 0) {
                showStatus("No links to clear.", true);
                return;
            }
            if (confirm("Delete all " + linksData.length + " links?")) {
                linksData = [];
                saveLinksToUrl();
                renderLinks();
                showStatus("🗑 All links cleared!");
            }
        }

        // ============================================================
        // SHARE
        // ============================================================
        function sharePage() {
            const shareUrl = getShareableUrl();

            if (navigator.share) {
                navigator.share({
                    title: "DropIt Links",
                    text: "Check out these links I saved!",
                    url: shareUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl).then(function() {
                    showStatus("📋 URL copied! Send it to any device.");
                }).catch(function() {
                    prompt("Copy this URL and open on any device:", shareUrl);
                });
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        addBtn.addEventListener("click", addLink);

        linkInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") addLink();
        });

        clearBtn.addEventListener("click", clearAll);
        shareBtn.addEventListener("click", sharePage);

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            loadLinksFromUrl();
            renderLinks();

            if (linksData.length > 0) {
                syncBadge.style.display = "inline";
            }
        }

        init();

        // Listen for hash changes (when someone shares updated URL)
        window.addEventListener("hashchange", function() {
            loadLinksFromUrl();
            renderLinks();
            showStatus("📥 Links updated from shared URL!");
        });
    </script>
</body>
</html>
