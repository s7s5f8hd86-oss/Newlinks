<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DropIt • by Sanjeet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }
        .card {
            background: #161b22;
            border-radius: 1.5rem;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 500px;
            padding: 1.8rem 1.4rem;
        }
        .header { text-align: center; margin-bottom: 1rem; }
        .header h1 { font-size: 2rem; color: #e6edf3; font-weight: 700; }
        .header .byline { font-size: 0.75rem; color: #8b949e; margin-top: 0.2rem; }
        .quote-box {
            background: #1c2129;
            border-left: 3px solid #f0883e;
            border-radius: 0.8rem;
            padding: 1rem 1.1rem;
            margin-bottom: 1.2rem;
        }
        .quote-text { font-size: 0.9rem; color: #c9d1d9; font-style: italic; line-height: 1.5; }
        .quote-author { font-size: 0.75rem; color: #8b949e; margin-top: 0.4rem; text-align: right; }
        .info-box {
            background: #1c2129;
            border: 1px solid #f0883e;
            border-radius: 0.8rem;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .info-box p { color: #f0883e; font-size: 0.8rem; margin: 0; }
        .info-box strong { color: #fff; }
        input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0.8rem;
            padding: 0.85rem 1rem;
            color: #e6edf3;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 0.6rem;
        }
        input:focus { border-color: #f0883e; }
        .input-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
        .input-row input { flex: 1; margin-bottom: 0; }
        button {
            background: #f0883e;
            color: #0d1117;
            border: none;
            border-radius: 0.8rem;
            padding: 0.85rem 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }
        button:active { transform: scale(0.96); }
        button.red { background: #da3633; color: white; }
        button.blue { background: #1f6feb; color: white; }
        .links-title { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin: 1rem 0 0.5rem; }
        .link-item {
            background: #1c2129;
            border: 1px solid #30363d;
            border-radius: 0.7rem;
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
        }
        .link-url { color: #58a6ff; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-decoration: none; }
        .visit-btn {
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .del-btn { background: none; border: none; color: #f85149; font-size: 1.1rem; cursor: pointer; padding: 0.2rem 0.4rem; font-weight: bold; }
        .empty { color: #484f58; text-align: center; font-size: 0.85rem; padding: 1.5rem; }
        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.7rem; color: #484f58; }
        .footer span { color: #f0883e; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📦 DropIt</h1>
            <div class="byline">written by <strong>Sanjeet</strong></div>
        </div>

        <div class="quote-box">
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-author" id="quoteAuthor"></div>
        </div>

        <div class="info-box">
            <p>🔗 <strong>How to sync:</strong> Add links → tap <strong>Copy Link</strong> → open on any device</p>
        </div>

        <div class="input-row">
            <input type="url" id="linkInput" placeholder="Paste any link here..." autocomplete="off" />
            <button id="addBtn">+ Add</button>
        </div>

        <div class="links-title">📋 saved links <span id="countSpan">(0)</span></div>
        <div id="linksContainer"><div class="empty">No links yet. Add one above.</div></div>

        <div class="input-row" style="margin-top: 0.8rem;">
            <button class="blue" id="copyLinkBtn">📋 Copy Shareable Link</button>
            <button class="red" id="clearBtn">🗑 Clear All</button>
        </div>

        <div class="footer">crafted by <span>Sanjeet</span></div>
    </div>

    <script>
        // ============================================================
        // DAILY QUOTES
        // ============================================================
        const quotes = [
            { text: "The wound is the place where the Light enters you.", author: "Rumi" },
            { text: "He who has a why to live can bear almost any how.", author: "Nietzsche" },
            { text: "In the middle of difficulty lies opportunity.", author: "Einstein" },
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Solitude is the place of purification.", author: "Martin Buber" },
            { text: "What you seek is seeking you.", author: "Rumi" },
            { text: "Success is not final, failure is not fatal.", author: "Churchill" },
            { text: "The unexamined life is not worth living.", author: "Socrates" },
            { text: "We are what we repeatedly do.", author: "Aristotle" },
            { text: "Love transforms enemies into friends.", author: "MLK Jr." },
            { text: "Hard times create strong men.", author: "G. Michael Hopf" },
            { text: "Become who you truly are.", author: "Carl Jung" },
            { text: "Be the change you wish to see.", author: "Gandhi" },
            { text: "Within me there lay an invincible summer.", author: "Camus" },
            { text: "He who conquers himself is mighty.", author: "Confucius" },
            { text: "The cave you fear holds the treasure.", author: "Joseph Campbell" },
            { text: "Rock bottom built my foundation.", author: "J.K. Rowling" },
            { text: "Rising every time we fall is glory.", author: "Mandela" },
            { text: "Solitude is the richness of self.", author: "May Sarton" },
            { text: "What you think you become.", author: "Buddha" },
        ];

        const today = new Date();
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        const q = quotes[dayOfYear % quotes.length];
        document.getElementById("quoteText").textContent = '"' + q.text + '"';
        document.getElementById("quoteAuthor").textContent = '— ' + q.author;

        // ============================================================
        // SIMPLE WORKING APPROACH: Store links in URL hash
        // ============================================================

        let links = [];

        // Load links from URL hash
        function loadLinks() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                try {
                    const decoded = decodeURIComponent(escape(atob(hash)));
                    links = JSON.parse(decoded);
                } catch (e) {
                    links = [];
                }
            }
        }

        // Save links to URL hash
        function saveLinks() {
            if (links.length === 0) {
                history.replaceState(null, "", window.location.pathname);
            } else {
                const json = JSON.stringify(links);
                const encoded = btoa(unescape(encodeURIComponent(json)));
                history.replaceState(null, "", window.location.pathname + "#" + encoded);
            }
        }

        // Render links
        function render() {
            document.getElementById("countSpan").textContent = "(" + links.length + ")";
            const container = document.getElementById("linksContainer");
            container.innerHTML = "";

            if (links.length === 0) {
                container.innerHTML = '<div class="empty">No links yet. Add one above.</div>';
                return;
            }

            links.slice().reverse().forEach(function(url, i) {
                const realIndex = links.length - 1 - i;
                const div = document.createElement("div");
                div.className = "link-item";

                const a = document.createElement("a");
                a.className = "link-url";
                a.textContent = url;
                a.title = url;
                a.href = url;
                a.target = "_blank";

                const visitBtn = document.createElement("button");
                visitBtn.className = "visit-btn";
                visitBtn.textContent = "Visit →";
                visitBtn.onclick = function(e) {
                    e.stopPropagation();
                    window.open(url, "_blank");
                };

                const delBtn = document.createElement("button");
                delBtn.className = "del-btn";
                delBtn.textContent = "✕";
                delBtn.onclick = function(e) {
                    e.stopPropagation();
                    links.splice(realIndex, 1);
                    saveLinks();
                    render();
                };

                div.appendChild(a);
                div.appendChild(visitBtn);
                div.appendChild(delBtn);
                container.appendChild(div);
            });
        }

        // Add link
        function addLink() {
            const input = document.getElementById("linkInput");
            let url = input.value.trim();

            if (!url) return;

            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }

            try {
                new URL(url);
            } catch (e) {
                alert("Please enter a valid link");
                return;
            }

            links.push(url);
            input.value = "";
            saveLinks();
            render();
        }

        // Clear all
        function clearAll() {
            if (links.length === 0) return;
            if (confirm("Delete all " + links.length + " links?")) {
                links = [];
                saveLinks();
                render();
            }
        }

        // Copy shareable link
        function copyShareableLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(function() {
                const btn = document.getElementById("copyLinkBtn");
                btn.textContent = "✅ Copied!";
                setTimeout(function() {
                    btn.textContent = "📋 Copy Shareable Link";
                }, 2000);
            }).catch(function() {
                prompt("Copy this link and share it:", url);
            });
        }

        // Event listeners
        document.getElementById("addBtn").addEventListener("click", addLink);
        document.getElementById("linkInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") addLink();
        });
        document.getElementById("clearBtn").addEventListener("click", clearAll);
        document.getElementById("copyLinkBtn").addEventListener("click", copyShareableLink);

        // Listen for hash changes (when opening shared link)
        window.addEventListener("hashchange", function() {
            loadLinks();
            render();
        });

        // Init
        loadLinks();
        render();
    </script>
</body>
</html>
