<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DropIt • by Sanjeet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }
        .card {
            background: #161b22;
            border-radius: 1.5rem;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 500px;
            padding: 1.8rem 1.4rem;
        }
        .header { text-align: center; margin-bottom: 0.8rem; }
        .header h1 { font-size: 2rem; color: #e6edf3; font-weight: 700; }
        .header .byline { font-size: 0.75rem; color: #8b949e; margin-top: 0.2rem; }
        .quote-box {
            background: #1c2129;
            border-left: 3px solid #f0883e;
            border-radius: 0.8rem;
            padding: 1rem 1.1rem;
            margin-bottom: 1rem;
        }
        .quote-text { font-size: 0.9rem; color: #c9d1d9; font-style: italic; line-height: 1.5; }
        .quote-author { font-size: 0.75rem; color: #8b949e; margin-top: 0.4rem; text-align: right; }
        input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0.8rem;
            padding: 0.85rem 1rem;
            color: #e6edf3;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 0.6rem;
        }
        input:focus { border-color: #f0883e; }
        .input-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
        .input-row input { flex: 1; margin-bottom: 0; }
        button {
            background: #f0883e;
            color: #0d1117;
            border: none;
            border-radius: 0.8rem;
            padding: 0.85rem 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }
        button:active { transform: scale(0.96); }
        button.red { background: #da3633; color: white; }
        button.blue { background: #1f6feb; color: white; }
        .links-title { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin: 1rem 0 0.5rem; }
        .link-item {
            background: #1c2129;
            border: 1px solid #30363d;
            border-radius: 0.7rem;
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
        }
        .link-url { color: #58a6ff; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-decoration: none; }
        .visit-btn {
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .del-btn { background: none; border: none; color: #f85149; font-size: 1.1rem; cursor: pointer; padding: 0.2rem 0.4rem; font-weight: bold; }
        .empty { color: #484f58; text-align: center; font-size: 0.85rem; padding: 1.5rem; }
        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.7rem; color: #484f58; }
        .footer span { color: #f0883e; }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #238636;
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 999;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📦 DropIt</h1>
            <div class="byline">written by <strong>Sanjeet</strong></div>
        </div>

        <div class="quote-box">
            <div class="quote-text" id="quoteText">Loading quote...</div>
            <div class="quote-author" id="quoteAuthor"></div>
        </div>

        <div class="input-row">
            <input type="url" id="linkInput" placeholder="Paste any link here..." autocomplete="off" />
            <button id="addBtn">+ Add</button>
        </div>

        <div class="links-title">📋 saved links <span id="countSpan">(0)</span></div>
        <div id="linksContainer"><div class="empty">No links yet. Add one above.</div></div>

        <div class="input-row" style="margin-top: 0.8rem;">
            <button class="blue" id="copyBtn">📋 Copy Shareable Link</button>
            <button class="red" id="clearBtn">🗑 Clear All</button>
        </div>

        <div class="footer">crafted by <span>Sanjeet</span></div>
    </div>

    <script>
        (function() {
            // ============================================================
            // FETCH RANDOM QUOTE FROM FREE API (unlimited, always fresh)
            // ============================================================
            async function fetchQuote() {
                try {
                    const response = await fetch("https://api.quotable.io/random?tags=philosophy|wisdom|love|success|solitude|courage|perseverance");
                    const data = await response.json();
                    document.getElementById("quoteText").textContent = '"' + data.content + '"';
                    document.getElementById("quoteAuthor").textContent = '— ' + data.author;
                } catch (e) {
                    // Fallback quotes if API fails
                    const fallback = [
                        { text: "The wound is the place where the Light enters you.", author: "Rumi" },
                        { text: "He who has a why to live can bear almost any how.", author: "Nietzsche" },
                        { text: "In the middle of difficulty lies opportunity.", author: "Einstein" },
                        { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
                        { text: "Solitude is the place of purification.", author: "Martin Buber" },
                    ];
                    const r = fallback[Math.floor(Math.random() * fallback.length)];
                    document.getElementById("quoteText").textContent = '"' + r.text + '"';
                    document.getElementById("quoteAuthor").textContent = '— ' + r.author;
                }
            }

            fetchQuote();

            // ============================================================
            // LINKS LOGIC
            // ============================================================
            var links = [];
            var linkInput = document.getElementById("linkInput");
            var addBtn = document.getElementById("addBtn");
            var linksContainer = document.getElementById("linksContainer");
            var countSpan = document.getElementById("countSpan");
            var copyBtn = document.getElementById("copyBtn");
            var clearBtn = document.getElementById("clearBtn");

            function loadLinks() {
                var hash = window.location.hash.substring(1);
                if (hash) {
                    try {
                        var json = decodeURIComponent(atob(hash));
                        links = JSON.parse(json);
                        if (!Array.isArray(links)) links = [];
                    } catch (e) {
                        links = [];
                    }
                }
            }

            function saveLinks() {
                if (links.length === 0) {
                    history.replaceState(null, "", window.location.pathname);
                } else {
                    var json = JSON.stringify(links);
                    var encoded = btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                        return String.fromCharCode("0x" + p1);
                    }));
                    history.replaceState(null, "", window.location.pathname + "#" + encoded);
                }
            }

            function render() {
                countSpan.textContent = "(" + links.length + ")";
                linksContainer.innerHTML = "";

                if (links.length === 0) {
                    linksContainer.innerHTML = '<div class="empty">No links yet. Add one above.</div>';
                    return;
                }

                for (var i = links.length - 1; i >= 0; i--) {
                    (function(index) {
                        var url = links[index];
                        var div = document.createElement("div");
                        div.className = "link-item";

                        var a = document.createElement("a");
                        a.className = "link-url";
                        a.textContent = url;
                        a.title = url;
                        a.href = url;
                        a.target = "_blank";
                        a.rel = "noopener";

                        var visitBtn = document.createElement("button");
                        visitBtn.className = "visit-btn";
                        visitBtn.textContent = "Visit →";
                        visitBtn.onclick = function(e) {
                            e.stopPropagation();
                            window.open(url, "_blank", "noopener");
                        };

                        var delBtn = document.createElement("button");
                        delBtn.className = "del-btn";
                        delBtn.textContent = "✕";
                        delBtn.onclick = function(e) {
                            e.stopPropagation();
                            links.splice(index, 1);
                            saveLinks();
                            render();
                            showToast("Link removed");
                        };

                        div.appendChild(a);
                        div.appendChild(visitBtn);
                        div.appendChild(delBtn);
                        linksContainer.appendChild(div);
                    })(i);
                }
            }

            function showToast(msg) {
                var existing = document.querySelector(".toast");
                if (existing) existing.remove();
                var toast = document.createElement("div");
                toast.className = "toast";
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(function() {
                    toast.style.opacity = "0";
                    setTimeout(function() { toast.remove(); }, 300);
                }, 2000);
            }

            addBtn.onclick = function() {
                var url = linkInput.value.trim();
                if (!url) {
                    showToast("Please paste a link");
                    return;
                }
                if (!/^https?:\/\//i.test(url)) {
                    url = "https://" + url;
                }
                try {
                    new URL(url);
                } catch (e) {
                    showToast("Invalid link");
                    return;
                }
                links.push(url);
                linkInput.value = "";
                saveLinks();
                render();
                showToast("Link added!");
            };

            linkInput.onkeypress = function(e) {
                if (e.key === "Enter") addBtn.onclick();
            };

            clearBtn.onclick = function() {
                if (links.length === 0) return;
                if (confirm("Delete all " + links.length + " links?")) {
                    links = [];
                    saveLinks();
                    render();
                    showToast("All cleared");
                }
            };

            copyBtn.onclick = function() {
                var url = window.location.href;
                navigator.clipboard.writeText(url).then(function() {
                    copyBtn.textContent = "✅ Copied!";
                    setTimeout(function() { copyBtn.textContent = "📋 Copy Shareable Link"; }, 2000);
                    showToast("Link copied! Share it.");
                }).catch(function() {
                    prompt("Copy this link:", url);
                });
            };

            window.onhashchange = function() {
                loadLinks();
                render();
            };

            loadLinks();
            render();
        })();
    </script>
</body>
</html>
