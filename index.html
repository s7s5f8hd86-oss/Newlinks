<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DropIt • by Sanjeet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1rem;
        }
        .card {
            background: #161b22;
            border-radius: 1.5rem;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 500px;
            padding: 1.8rem 1.4rem;
        }
        .header { text-align: center; margin-bottom: 1rem; }
        .header h1 { font-size: 2rem; color: #e6edf3; font-weight: 700; }
        .header .byline { font-size: 0.75rem; color: #8b949e; margin-top: 0.2rem; }
        .quote-box {
            background: #1c2129;
            border-left: 3px solid #58a6ff;
            border-radius: 0.8rem;
            padding: 1rem 1.1rem;
            margin-bottom: 1.2rem;
        }
        .quote-text { font-size: 0.9rem; color: #c9d1d9; font-style: italic; line-height: 1.5; }
        .quote-author { font-size: 0.75rem; color: #8b949e; margin-top: 0.4rem; text-align: right; }
        .code-section {
            background: #0d1117;
            border-radius: 1rem;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #30363d;
        }
        .code-label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        .code-big { font-size: 2.5rem; font-weight: 800; color: #58a6ff; letter-spacing: 5px; font-family: 'SF Mono', monospace; }
        .code-input-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .code-input-row input { flex: 1; }
        input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0.8rem;
            padding: 0.85rem 1rem;
            color: #e6edf3;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: #58a6ff; }
        .input-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .input-row input { flex: 1; }
        button {
            background: #238636;
            color: white;
            border: none;
            border-radius: 0.8rem;
            padding: 0.85rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }
        button:active { transform: scale(0.96); }
        button.red { background: #da3633; }
        button.blue { background: #1f6feb; }
        button.small { padding: 0.6rem 0.8rem; font-size: 0.8rem; }
        .links-title { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
        .link-item {
            background: #1c2129;
            border: 1px solid #30363d;
            border-radius: 0.7rem;
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
        }
        .link-url { color: #c9d1d9; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .visit-btn {
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .del-btn { background: none; border: none; color: #8b949e; font-size: 1.3rem; cursor: pointer; padding: 0 0.2rem; }
        .empty { color: #484f58; text-align: center; font-size: 0.85rem; padding: 1.5rem; }
        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.7rem; color: #484f58; }
        .footer span { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>📦 DropIt</h1>
            <div class="byline">written by <strong>Sanjeet</strong></div>
        </div>

        <div class="quote-box">
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-author" id="quoteAuthor"></div>
        </div>

        <!-- Change Access Code -->
        <div class="code-section">
            <div class="code-label">current access code</div>
            <div class="code-big" id="codeDisplay">1234</div>
        </div>
        <div class="code-input-row">
            <input type="text" id="codeInput" placeholder="Type new code..." autocomplete="off" />
            <button class="blue small" id="changeCodeBtn">Change Code</button>
        </div>

        <!-- Add Link -->
        <div class="input-row">
            <input type="url" id="linkInput" placeholder="Paste any link here..." autocomplete="off" />
            <button id="addBtn">+ Add</button>
        </div>

        <!-- Links List -->
        <div class="links-title">📋 saved links <span id="countSpan">(0)</span></div>
        <div id="linksContainer"><div class="empty">No links yet. Add one above.</div></div>

        <!-- Buttons -->
        <div class="input-row" style="margin-top: 0.8rem;">
            <button class="blue" id="copyBtn">📋 Copy Code</button>
            <button class="red" id="clearBtn">🗑 Clear All</button>
        </div>

        <div class="footer">crafted by <span>Sanjeet</span> • links sync in real-time</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxNYjDZkFhDqJBbRmXGHPOQOlkkVmAY1I",
            authDomain: "linkdrop-demo.firebaseapp.com",
            databaseURL: "https://linkdrop-demo-default-rtdb.firebaseio.com",
            projectId: "linkdrop-demo",
            storageBucket: "linkdrop-demo.appspot.com",
            messagingSenderId: "227849642883",
            appId: "1:227849642883:web:7c8b1f6e4a2d9f5b8c3e1a"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Default code
        let currentCode = "1234";
        let linksRef = ref(database, "links/" + currentCode);
        let currentListener = null;

        // Quotes
        const quotes = [
            { text: "The wound is the place where the Light enters you.", author: "Rumi" },
            { text: "He who has a why to live can bear almost any how.", author: "Nietzsche" },
            { text: "In the middle of difficulty lies opportunity.", author: "Einstein" },
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Solitude is the place of purification.", author: "Martin Buber" },
            { text: "What you seek is seeking you.", author: "Rumi" },
            { text: "Success is not final, failure is not fatal.", author: "Churchill" },
            { text: "The unexamined life is not worth living.", author: "Socrates" },
            { text: "We are what we repeatedly do.", author: "Aristotle" },
            { text: "Love transforms enemies into friends.", author: "MLK Jr." },
            { text: "It is not that we have short time, but we waste a lot.", author: "Seneca" },
            { text: "Hard times create strong men.", author: "G. Michael Hopf" },
            { text: "Become who you truly are.", author: "Carl Jung" },
            { text: "Be the change you wish to see.", author: "Gandhi" },
            { text: "Within me there lay an invincible summer.", author: "Camus" },
            { text: "Patience is bitter, but its fruit is sweet.", author: "Aristotle" },
            { text: "He who conquers himself is mighty.", author: "Confucius" },
            { text: "The cave you fear holds the treasure.", author: "Joseph Campbell" },
            { text: "To love and be loved is sun from both sides.", author: "David Viscott" },
            { text: "Leave a trail where there is no path.", author: "Emerson" },
            { text: "Find barriers within you against love.", author: "Rumi" },
            { text: "The oak sleeps in the acorn.", author: "James Allen" },
            { text: "Happiness depends upon ourselves.", author: "Aristotle" },
            { text: "The only journey is the one within.", author: "Rilke" },
            { text: "Rock bottom built my foundation.", author: "J.K. Rowling" },
            { text: "You've been planted, not buried.", author: "Christine Caine" },
            { text: "Rising every time we fall is glory.", author: "Mandela" },
            { text: "Solitude is the richness of self.", author: "May Sarton" },
            { text: "What lies within us matters most.", author: "Emerson" },
            { text: "What you think you become.", author: "Buddha" },
            { text: "Love removes masks we fear to lose.", author: "James Baldwin" },
        ];

        // Set daily quote
        const today = new Date();
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        const q = quotes[dayOfYear % quotes.length];
        document.getElementById("quoteText").textContent = `"${q.text}"`;
        document.getElementById("quoteAuthor").textContent = `— ${q.author}`;

        // DOM elements
        const codeDisplay = document.getElementById("codeDisplay");
        const codeInput = document.getElementById("codeInput");
        const changeCodeBtn = document.getElementById("changeCodeBtn");
        const linkInput = document.getElementById("linkInput");
        const addBtn = document.getElementById("addBtn");
        const linksContainer = document.getElementById("linksContainer");
        const countSpan = document.getElementById("countSpan");
        const copyBtn = document.getElementById("copyBtn");
        const clearBtn = document.getElementById("clearBtn");

        let linksData = {};

        // Function to attach listener
        function attachListener() {
            // Remove old listener
            if (currentListener) {
                off(linksRef, "value", currentListener);
            }
            // Create new ref
            linksRef = ref(database, "links/" + currentCode);
            // Attach new listener
            currentListener = onValue(linksRef, (snapshot) => {
                linksData = snapshot.val() || {};
                renderLinks();
            }, (error) => {
                console.error("Firebase error:", error);
                alert("Connection error. Please check your internet.");
            });
        }

        // Render links
        function renderLinks() {
            const entries = Object.entries(linksData);
            countSpan.textContent = `(${entries.length})`;
            linksContainer.innerHTML = "";

            if (entries.length === 0) {
                linksContainer.innerHTML = '<div class="empty">No links yet. Add one above.</div>';
                return;
            }

            entries.reverse();

            entries.forEach(([key, url]) => {
                const div = document.createElement("div");
                div.className = "link-item";

                const us = document.createElement("span");
                us.className = "link-url";
                us.textContent = url;
                us.title = url;

                const vb = document.createElement("button");
                vb.className = "visit-btn";
                vb.textContent = "Visit →";
                vb.addEventListener("click", () => window.open(url, "_blank", "noopener"));

                const db = document.createElement("button");
                db.className = "del-btn";
                db.textContent = "✕";
                db.addEventListener("click", () => {
                    const deleteRef = ref(database, "links/" + currentCode + "/" + key);
                    remove(deleteRef);
                });

                div.appendChild(us);
                div.appendChild(vb);
                div.appendChild(db);
                linksContainer.appendChild(div);
            });
        }

        // Add link
        function addLink() {
            let url = linkInput.value.trim();
            if (!url) {
                alert("Please paste a link first.");
                return;
            }
            if (!/^https?:\/\//i.test(url)) {
                url = "https://" + url;
            }
            try {
                new URL(url);
            } catch (e) {
                alert("Please enter a valid link.");
                return;
            }

            const newLinkRef = push(linksRef);
            set(newLinkRef, url).then(() => {
                console.log("Link added successfully:", url);
                linkInput.value = "";
            }).catch((error) => {
                console.error("Error adding link:", error);
                alert("Failed to add link. Check your internet connection.");
            });
        }

        // Change code
        function changeCode() {
            const newCode = codeInput.value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
            if (!newCode) {
                alert("Please enter a valid code (letters/numbers only).");
                return;
            }
            currentCode = newCode;
            codeDisplay.textContent = currentCode;
            codeInput.value = "";
            attachListener();
        }

        // Event listeners
        addBtn.addEventListener("click", addLink);
        linkInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") addLink();
        });

        changeCodeBtn.addEventListener("click", changeCode);
        codeInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") changeCode();
        });

        copyBtn.addEventListener("click", () => {
            navigator.clipboard.writeText(currentCode).then(() => {
                copyBtn.textContent = "✅ Copied!";
                setTimeout(() => { copyBtn.textContent = "📋 Copy Code"; }, 1500);
            }).catch(() => {
                alert("Code: " + currentCode);
            });
        });

        clearBtn.addEventListener("click", () => {
            if (Object.keys(linksData).length === 0) {
                alert("No links to clear.");
                return;
            }
            if (confirm("Delete all links for code '" + currentCode + "'?")) {
                set(linksRef, null).then(() => {
                    console.log("All links cleared.");
                }).catch((error) => {
                    console.error("Error clearing links:", error);
                });
            }
        });

        // Initialize
        codeDisplay.textContent = currentCode;
        attachListener();
    </script>
</body>
</html>
